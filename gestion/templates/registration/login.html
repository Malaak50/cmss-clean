{% extends "base.html" %}
{% load static %}

{% block content %}
<!-- Titre Connexion en blanc -->
<h1 class="login-main-title">Connexion</h1>

<!-- Carte de formulaire -->
<div class="login-card-container">
    <div class="login-card">
        <!-- Message d'erreur -->
        {% if form.errors %}
        <div class="alert alert-error">
            <i class="fas fa-exclamation-circle alert-icon"></i>
            <span>Identifiants incorrects. Veuillez réessayer.</span>
            <i class="fas fa-times alert-close"></i>
        </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Nom d'utilisateur</label>
                <input type="text" name="username" id="id_username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="id_password">Mot de passe</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="id_password" class="form-control" required>
                    <i class="toggle-password fas fa-eye"></i>
                </div>
            </div>
            
            <button type="submit" class="btn-connect">Se connecter</button>
        </form>
    </div>
</div>

<script>
    // Fermeture des alertes
    document.querySelectorAll('.alert-close').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.target.closest('.alert').style.opacity = '0';
            setTimeout(() => {
                e.target.closest('.alert').remove();
            }, 300);
        });
    });
</script>
{% endblock %}
