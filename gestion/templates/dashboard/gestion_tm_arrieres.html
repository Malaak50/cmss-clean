<div class="modal-header" style="background-color: #28C7A2; color: white;">
    <h5 class="modal-title" id="tmArrieresModalLabel">Gestion TM/Arriérés</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body">
    <div id="alert-container" class="position-fixed top-0 end-0 p-3" style="z-index: 9999"></div>
    
    <ul class="nav nav-tabs" id="tmArrieresTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tm-tab" data-bs-toggle="tab" data-bs-target="#tm-tab-pane" type="button" role="tab" aria-controls="tm-tab-pane" aria-selected="true" style="color: #3B947F;">TM</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="arrieres-tab" data-bs-toggle="tab" data-bs-target="#arrieres-tab-pane" type="button" role="tab" aria-controls="arrieres-tab-pane" aria-selected="false" style="color: #3B947F;">Arriérés</button>
        </li>
    </ul>
    
    <div class="tab-content" id="tmArrieresTabContent">
        <!-- Onglet TM -->
        <div class="tab-pane fade show active" id="tm-tab-pane" role="tabpanel" aria-labelledby="tm-tab" tabindex="0">
            <form id="tmForm" method="post" class="mt-3">
                {% csrf_token %}
                <input type="hidden" id="tmRetraiteNumSecu" name="retraite_num_secu">
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="tmDate" class="form-label">Date</label>
                        <input type="date" class="form-control" id="tmDate" name="date_tm" required>
                    </div>
                    <div class="col-md-6">
                        <label for="tmMontant" class="form-label">Montant total</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="tmMontant" name="montant_total" required>
                    </div>
                    <div class="col-md-6">
                        <label for="tmStatut" class="form-label">Statut</label>
                        <select class="form-select" id="tmStatut" name="statut">
                            <option value="EN_ATTENTE">En attente</option>
                            <option value="PAYE">Payé</option>
                            <option value="ANNULE">Annulé</option>
                        </select>
                    </div>
                </div>
                
                <div class="text-end mt-3">
                    <button type="submit" class="btn" style="background-color: #28C7A2; color: white;">
                        <i class="fas fa-save"></i> Enregistrer TM
                    </button>
                </div>
            </form>
        </div>
   
        <!-- Onglet Arriérés -->
        <div class="tab-pane fade" id="arrieres-tab-pane" role="tabpanel" aria-labelledby="arrieres-tab" tabindex="0">
            <form id="arrieresForm" method="post" class="mt-3">
                {% csrf_token %}
                <input type="hidden" id="arrieresRetraiteNumSecu" name="retraite_num_secu">
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="arrieresDate" class="form-label">Date</label>
                        <input type="date" class="form-control" id="arrieresDate" name="date_arriere" required>
                    </div>
                    <div class="col-md-6">
                        <label for="arrieresType" class="form-label">Type</label>
                        <select class="form-select" id="arrieresType" name="type_arriere" required>
                            <option value="">Sélectionner</option>
                            <option value="CMSS">CMSS</option>
                            <option value="CMCAS">CMCAS</option>
                            <option value="LES_DEUX">Les deux</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="arrieresMois" class="form-label">Nombre de mois</label>
                        <input type="number" class="form-control" id="arrieresMois" name="nombre_de_mois" min="1" required>
                    </div>
                    <div class="col-md-6 arriere-montant" id="cmssMontantField" style="display: none;">
                        <label for="arrieresMontantCmss" class="form-label">Montant CMSS</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="arrieresMontantCmss" name="montant_cmss">
                    </div>
                    <div class="col-md-6 arriere-montant" id="cmcasMontantField" style="display: none;">
                        <label for="arrieresMontantCmcas" class="form-label">Montant CMCAS</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="arrieresMontantCmcas" name="montant_cmcas">
                    </div>
                    <div class="col-md-6">
                        <label for="arrieresStatut" class="form-label">Statut</label>
                        <select class="form-select" id="arrieresStatut" name="statut">
                            <option value="EN_ATTENTE">En attente</option>
                            <option value="PAYE">Payé</option>
                            <option value="ANNULE">Annulé</option>
                        </select>
                    </div>
                </div>
                
                <div class="text-end mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Enregistrer Arriérés
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
        <i class="fas fa-times"></i> Fermer
    </button>
</div>

<script>
// Fonction globale pour afficher les alertes
function showAlert(message, isSuccess = true) {
    const alertContainer = document.getElementById('alert-container');
    if (!alertContainer) return;
    
    const alertType = isSuccess ? 'alert-success' : 'alert-danger';
    const icon = isSuccess ? 'fa-check-circle' : 'fa-exclamation-triangle';
    
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert ${alertType} alert-dismissible fade show`;
    alertDiv.setAttribute('role', 'alert');
    alertDiv.innerHTML = `
        <i class="fas ${icon} me-2"></i>
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    `;
    
    alertContainer.appendChild(alertDiv);
    
    setTimeout(() => {
        alertDiv.remove();
    }, 5000);
}

// Gestion de la visibilité des champs montant
function updateArriereFields() {
    const type = document.getElementById('arrieresType').value;
    const cmssField = document.getElementById('cmssMontantField');
    const cmcasField = document.getElementById('cmcasMontantField');
    
    if (type === 'CMSS' || type === 'LES_DEUX') {
        cmssField.style.display = 'block';
        document.getElementById('arrieresMontantCmss').required = true;
    } else {
        cmssField.style.display = 'none';
        document.getElementById('arrieresMontantCmss').required = false;
        document.getElementById('arrieresMontantCmss').value = '';
    }
    
    if (type === 'CMCAS' || type === 'LES_DEUX') {
        cmcasField.style.display = 'block';
        document.getElementById('arrieresMontantCmcas').required = true;
    } else {
        cmcasField.style.display = 'none';
        document.getElementById('arrieresMontantCmcas').required = false;
        document.getElementById('arrieresMontantCmcas').value = '';
    }
}

// Fonction pour valider les nombres décimaux
function validateDecimal(inputValue) {
    if (inputValue === null || inputValue === undefined || inputValue === '') return false;
    const num = parseFloat(inputValue);
    return !isNaN(num) && num >= 0;
}

// Initialisation
document.addEventListener('DOMContentLoaded', function() {
    // Variables pour empêcher les soumissions multiples
    let isTmSubmitting = false;
    let isArrieresSubmitting = false;

    // Gestion des champs arriérés
    document.getElementById('arrieresType').addEventListener('change', updateArriereFields);
    updateArriereFields();

    // Gestion de la soumission TM
    const tmForm = document.getElementById('tmForm');
    if (tmForm) {
        tmForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (isTmSubmitting) return;
            isTmSubmitting = true;
            
            const submitButton = this.querySelector('button[type="submit"]');
            const originalText = submitButton.innerHTML;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> En cours...';
            submitButton.disabled = true;
            
            try {
                const formData = new FormData(this);
                const retraiteNumSecu = document.getElementById('tmRetraiteNumSecu').value;
                
                // Validation stricte côté client
                if (!retraiteNumSecu) {
                    throw new Error('Numéro de sécurité sociale manquant');
                }
                
                const tmDate = formData.get('date_tm');
                const tmMontant = formData.get('montant_total');
                
                if (!tmDate || !tmMontant) {
                    throw new Error('Tous les champs obligatoires doivent être remplis');
                }
                
                if (!validateDecimal(tmMontant)) {
                    throw new Error('Le montant doit être un nombre valide (≥ 0)');
                }

                const response = await fetch(`/retraite/${retraiteNumSecu}/enregistrer-tm/`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Erreur HTTP: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    showAlert('TM enregistré avec succès !');
                    tmForm.reset();
                    
                    // Fermeture optionnelle de la modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('tmArrieresModal'));
                    if (modal) modal.hide();
                } else {
                    throw new Error(data.error || 'Erreur lors de l\'enregistrement du TM');
                }
            } catch (error) {
                console.error('Erreur TM:', error);
                showAlert(`Échec: ${error.message}`, false);
            } finally {
                isTmSubmitting = false;
                submitButton.innerHTML = originalText;
                submitButton.disabled = false;
            }
        });
    }

    // Gestion de la soumission Arriérés
document.getElementById('arrieresForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    if (isArrieresSubmitting) return;
    isArrieresSubmitting = true;
    
    const submitButton = this.querySelector('button[type="submit"]');
    const originalText = submitButton.innerHTML;
    submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> En cours...';
    submitButton.disabled = true;
    
    try {
        const formData = new FormData(this);
        const retraiteNumSecu = document.getElementById('arrieresRetraiteNumSecu').value;
        
        if (!retraiteNumSecu) throw new Error('Numéro de sécurité sociale manquant');
        
        const response = await fetch(`/retraite/${retraiteNumSecu}/enregistrer-arrieres/`, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        });
        
        const data = await response.json();
        
        if (data.success) {
            showAlert('Arriéré enregistré avec succès !');
            this.reset();
            updateArriereFields();
            
            const modal = bootstrap.Modal.getInstance(document.getElementById('tmArrieresModal'));
            if (modal) modal.hide();
        } else {
            // Gestion des erreurs de formulaire Django
            if (data.errors) {
                let errorMessage = 'Erreurs de validation: ';
                for (const field in data.errors) {
                    errorMessage += data.errors[field].join(', ') + ' ';
                }
                throw new Error(errorMessage);
            } else {
                throw new Error(data.error || 'Erreur lors de l\'enregistrement');
            }
        }
    } catch (error) {
        console.error('Erreur Arriéré:', error);
        showAlert(`Échec: ${error.message}`, false);
    } finally {
        isArrieresSubmitting = false;
        submitButton.innerHTML = originalText;
        submitButton.disabled = false;
    }
});
// Initialisation de la modal
    const tmArrieresModal = document.getElementById('tmArrieresModal');
    if (tmArrieresModal) {
        tmArrieresModal.addEventListener('show.bs.modal', function(event) {
            const button = event.relatedTarget;

            const retraiteNumSecu = localStorage.getItem('data_retraite_num_secu');
            
            // Debug log
            console.log('Ouverture modal pour retraité:', retraiteNumSecu);
            
            // Assignation stricte des valeurs
            document.getElementById('tmRetraiteNumSecu').value = retraiteNumSecu;
            document.getElementById('arrieresRetraiteNumSecu').value = retraiteNumSecu;
            
            // Réinitialisation des formulaires
            if (tmForm) tmForm.reset();
            if (arrieresForm) {
                arrieresForm.reset();
                updateArriereFields();
            }
        });
    }
});
// Fonction pour formater les nombres décimaux (remplace les virgules par des points)
function formatDecimalForSubmit(value) {
    if (!value) return value;
    return value.toString().replace(',', '.');
}

// Modifiez la fonction updateArriereFields pour une meilleure gestion :
function updateArriereFields() {
    const type = document.getElementById('arrieresType').value;
    const cmssField = document.getElementById('cmssMontantField');
    const cmcasField = document.getElementById('cmcasMontantField');
    const cmssInput = document.getElementById('arrieresMontantCmss');
    const cmcasInput = document.getElementById('arrieresMontantCmcas');
    
    // Réinitialiser les champs requis
    cmssInput.required = false;
    cmcasInput.required = false;
    
    if (type === 'CMSS' || type === 'LES_DEUX') {
        cmssField.style.display = 'block';
        cmssInput.required = true;
    } else {
        cmssField.style.display = 'none';
        cmssInput.value = '';
    }
    
    if (type === 'CMCAS' || type === 'LES_DEUX') {
        cmcasField.style.display = 'block';
        cmcasInput.required = true;
    } else {
        cmcasField.style.display = 'none';
        cmcasInput.value = '';
    }
}
</script>
